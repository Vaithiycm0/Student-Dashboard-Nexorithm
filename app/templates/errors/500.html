{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5 text-center">
  <div class="col-md-6">
    <div class="display-1 text-danger fw-bold mb-3"><i class="bi bi-exclamation-octagon"></i> 500</div>
    <h2 class="h4 mb-3">Internal Server Error</h2>
    <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <i class="bi bi-arrow-clockwise me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
