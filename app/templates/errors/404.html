{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5 text-center">
  <div class="col-md-6">
    <div class="display-1 text-warning fw-bold mb-3"><i class="bi bi-question-circle"></i> 404</div>
    <h2 class="h4 mb-3">Page Not Found</h2>
    <p class="text-muted mb-4">The resource you requested could not be found or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <i class="bi bi-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
