{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5 text-center">
  <div class="col-md-6">
    <div class="display-1 text-danger fw-bold mb-3"><i class="bi bi-shield-x"></i> 403</div>
    <h2 class="h4 mb-3">Access Forbidden</h2>
    <p class="text-muted mb-4">You do not have the required permissions or role to access this page.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
